    if (!arr || !arr.length) return null;
    const n = arr.length;
    return SPELLS[arr[((Math.floor(time * 1.5) % n) + n) % n]].color;
  }
  function spellColors(arr) { return (arr || []).map((k) => SPELLS[k].color); }

  function drawShadow(x, y, r, wide) {
    ctx.fillStyle = "rgba(0,0,0,.32)";
    ctx.beginPath();
    ctx.ellipse(x, y + r * 1.45, r * 1.05 * (wide || 1), r * 0.36, 0, 0, TAU);
    ctx.fill();
  }

  function drawFace(hx, hy, r, angle) {
    const R = r * 0.85;
    ctx.save();
    ctx.beginPath(); ctx.arc(hx, hy, R, 0, TAU); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    const ox = Math.cos(angle) * r * 0.12, oy = Math.sin(angle) * r * 0.1;
    ctx.drawImage(faceCv, hx - R + ox, hy - R + oy, R * 2, R * 2);
    ctx.restore();
  }

  function drawBody(x, y, r, maskCol, bodyCol, eyeCol, markCol, angle, flash, walk, wide, lk) {
    wide = wide || 1;
    const step = Math.sin(walk) * 3;
    ctx.fillStyle = flash ? "#fff" : (lk ? lk.boots : "#14141a");
    ctx.beginPath(); ctx.ellipse(x - r * 0.38 * wide, y + r * 1.3 - Math.max(0, step) * 0.5, r * 0.3, r * 0.18, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.38 * wide, y + r * 1.3 - Math.max(0, -step) * 0.5, r * 0.3, r * 0.18, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = flash ? "#fff" : bodyCol;
    rrect(x - r * 0.78 * wide, y + r * 0.02, r * 1.56 * wide, r * 1.2, r * 0.5); ctx.fill();
    ctx.fillStyle = lk ? lk.accent : "rgba(0,0,0,.3)";
    ctx.fillRect(x - r * 0.78 * wide + 2, y + r * 0.7, r * 1.56 * wide - 4, r * 0.15);
    const hx = x, hy = y - r * 0.2;
    ctx.beginPath(); ctx.arc(hx, hy, r * 0.85, 0, TAU);
    ctx.fillStyle = flash ? "#ffb0b0" : maskCol; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 2; ctx.stroke();
    if (lk) drawFace(hx, hy, r, angle);
    else {
      ctx.strokeStyle = markCol; ctx.lineWidth = Math.max(1.2, r * 0.07); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(hx - r * 0.5, hy + r * 0.2); ctx.lineTo(hx - r * 0.38, hy + r * 0.48); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx + r * 0.5, hy + r * 0.2); ctx.lineTo(hx + r * 0.38, hy + r * 0.48); ctx.stroke();
      const ox = Math.cos(angle) * r * 0.1, oy = Math.sin(angle) * r * 0.08;
      ctx.fillStyle = eyeCol;
      ctx.shadowColor = eyeCol; ctx.shadowBlur = 8;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(hx + side * r * 0.33 + ox, hy - r * 0.1 + oy, r * 0.2, r * 0.12, side * 0.25, 0, TAU);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  }

  function swordAng(st, angle) {
    const half = st.arc / 2 + 0.3, u = st.swingU;
    if (u >= 0) return lerp(angle - st.swingDir * half, angle + st.swingDir * half, easeInOut(u));
    return angle - 0.7 + Math.sin(st.walk) * 0.05;
  }

  function drawSwordShape(hx, hy, ang, len, glow) {
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang);
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
    ctx.fillStyle = "#5a3a22"; ctx.fillRect(-9, -2.5, 10, 5);
    ctx.beginPath(); ctx.arc(-10, 0, 3.2, 0, TAU); ctx.fillStyle = "#d4aa4c"; ctx.fill();
    ctx.fillStyle = "#d4aa4c"; ctx.fillRect(0, -8, 4, 16);
    const g = ctx.createLinearGradient(0, -4, 0, 4);
    g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#a9b3c8");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(4, -3.8); ctx.lineTo(len - 9, -3.3); ctx.lineTo(len, 0); ctx.lineTo(len - 9, 3.3); ctx.lineTo(4, 3.8); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(110,120,145,.85)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(len - 11, 0); ctx.stroke();
    ctx.restore();
  }

  function drawArrowLocal(x0, len, glow) {
    ctx.save();
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 10; }
    ctx.strokeStyle = "#dccaa0"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + len - 4, 0); ctx.stroke();
    ctx.fillStyle = "#eef2fa";
    ctx.beginPath(); ctx.moveTo(x0 + len, 0); ctx.lineTo(x0 + len - 9, -3.8); ctx.lineTo(x0 + len - 9, 3.8); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = glow || "#d94a4a";
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 - 5, -3.8); ctx.lineTo(x0 + 6, 0); ctx.lineTo(x0 - 5, 3.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawBowShape(bx, by, ang, pull, recoil, glow, scale) {
    const col = glow || "#6ad0ff";
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(ang); ctx.scale(scale, scale);
    const limb = () => {
      ctx.beginPath();
      ctx.moveTo(-8, -34);
      ctx.bezierCurveTo(-2, -30, 9, -14, 6, -4);
      ctx.lineTo(6, 4);
      ctx.bezierCurveTo(9, 14, -2, 30, -8, 34);
    };
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    // dark outline (with glow when enchanted)
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
    ctx.strokeStyle = "#2e1a0c"; ctx.lineWidth = 7.5; limb(); ctx.stroke();
    ctx.shadowBlur = 0;
    // wood body
    const g = ctx.createLinearGradient(0, -34, 0, 34);
    g.addColorStop(0, "#d6a566"); g.addColorStop(0.5, "#8d5a2a"); g.addColorStop(1, "#d6a566");
    ctx.strokeStyle = g; ctx.lineWidth = 4.8; limb(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,240,200,.55)"; ctx.lineWidth = 1.2; limb(); ctx.stroke();
    // glowing runes along the limbs (brighter as you draw)
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = col; ctx.globalAlpha = 0.14 + pull * 0.35 + (glow ? 0.1 : 0);
    ctx.lineWidth = 2; ctx.setLineDash([3, 6]); limb(); ctx.stroke();
    ctx.restore();
    // metal tips
    for (const sd of [-1, 1]) {
      ctx.fillStyle = "#e8dcc0";
      ctx.beginPath(); ctx.arc(-8, sd * 34, 2.8, 0, TAU); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(-8, sd * 34, 1.3, 0, TAU); ctx.fill();
    }
    // grip + gem
    ctx.fillStyle = "#4a2c14"; rrect(2.5, -7.5, 7, 15, 2); ctx.fill();
    ctx.strokeStyle = "#c9a24a"; ctx.lineWidth = 1.2;
    for (const gy of [-5, 0, 5]) { ctx.beginPath(); ctx.moveTo(2.5, gy); ctx.lineTo(9.5, gy); ctx.stroke(); }
    ctx.shadowColor = col; ctx.shadowBlur = 10;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(6, 0, 2.6, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // string (turns into an energy string while drawn)
    const sx = -8 - pull * 22 + Math.sin(recoil * 90) * recoil * 22;
    ctx.strokeStyle = "rgba(245,245,245,.9)"; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-8, -34); ctx.lineTo(sx, 0); ctx.lineTo(-8, 34); ctx.stroke();
    if (pull > 0.05) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = col; ctx.globalAlpha = 0.18 + pull * 0.4; ctx.lineWidth = 1.2 + pull * 2;
      ctx.beginPath(); ctx.moveTo(-8, -34); ctx.lineTo(sx, 0); ctx.lineTo(-8, 34); ctx.stroke();
      ctx.restore();
    }
    if (pull > 0.03) drawArrowLocal(sx, 42, pull > 0.35 || glow ? col : null);
    ctx.restore();
  }

  // st = { weapon, reach, arc, glow, colors, walk, swingU, swingDir, pull, recoil, switchS }
  function drawWeapon(x, y, r, angle, st) {
    if (st.noWeapon) return;
    if (st.weapon === "sword") {
      const reach = st.reach, len = reach - 14;
      const half = st.arc / 2 + 0.3, dir = st.swingDir;
      const u = st.swingU;
      const ang = swordAng(st, angle);
      const cols = st.colors && st.colors.length ? st.colors : st.glow ? [st.glow] : [];
      if (u >= 0) {
        const e1 = easeInOut(u), e0 = easeInOut(Math.max(0, u - 0.55));
        const aS = lerp(angle - dir * half, angle + dir * half, e0);
        const aE = lerp(angle - dir * half, angle + dir * half, e1);
        const cy = y + r * 0.2;
        const layers = cols.length ? cols : ["#cfe0ff"];
        // faded blade afterimages (motion blur)
        for (let gi = 1; gi <= 3; gi++) {
          const ga = swordAng({ arc: st.arc, swingDir: dir, swingU: Math.max(0, u - gi * 0.07), walk: st.walk }, angle);
          ctx.save();
          ctx.globalAlpha = (0.3 / gi) * (1 - u * 0.4);
          drawSwordShape(x + Math.cos(ga) * r * 0.9, y + r * 0.25 + Math.sin(ga) * r * 0.7, ga, len * st.switchS, layers[0]);
          ctx.restore();
        }
        // crescent that fades out toward its tail
        const N = 10;
        layers.forEach((c, k) => {
          const ro = reach * (0.98 - 0.07 * k), ri = reach * (0.3 + 0.05 * k);
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = c;
          for (let i = 0; i < N; i++) {
            const t1 = (i + 1) / N;
            const a0 = lerp(aS, aE, i / N), a1 = lerp(aS, aE, Math.min(1, t1 + 0.03));
            ctx.beginPath();
            ctx.arc(x, cy, ro, a0, a1, dir < 0);
            ctx.arc(x, cy, ri, a1, a0, dir > 0);
            ctx.closePath();
            ctx.globalAlpha = Math.pow(t1, 1.7) * 0.5 * (1 - u * 0.45) / (1 + k * 0.3);
            ctx.fill();
          }
          ctx.restore();
        });
        // bright leading edge, fading toward the tail
        ctx.save();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
        for (let i = 0; i < N; i++) {
          const t1 = (i + 1) / N;
          ctx.globalAlpha = Math.pow(t1, 2) * 0.95 * (1 - u * 0.45);
          ctx.beginPath(); ctx.arc(x, cy, reach * 0.98, lerp(aS, aE, i / N), lerp(aS, aE, Math.min(1, t1 + 0.03)), dir < 0); ctx.stroke();
        }
        ctx.restore();
      }
      const hx = x + Math.cos(ang) * r * 0.9, hy = y + r * 0.25 + Math.sin(ang) * r * 0.7;
      drawSwordShape(hx, hy, ang, len * st.switchS, st.glow);
      if (cols.length) glowAt(hx + Math.cos(ang) * len * 0.8, hy + Math.sin(ang) * len * 0.8, st.glow || cols[0], 22, 0.55 + 0.2 * Math.sin(time * 9));
      if (u < 0) {
        // idle shimmer: a glint sweeps along the blade every couple of seconds
        const ph = (time * 0.5) % 1;
        if (ph < 0.3) {
          const t = ph / 0.3, ga = Math.sin(t * Math.PI);
          const gx = hx + Math.cos(ang) * (16 + (len - 24) * t), gy = hy + Math.sin(ang) * (16 + (len - 24) * t);
          glowAt(gx, gy, "#ffffff", 4 + 8 * ga, 0.7 * ga);
          ctx.save(); ctx.globalAlpha = ga; drawStar(gx, gy, 2 + 5 * ga, time * 2, "#ffffff"); ctx.restore();
        }
      }
      ctx.fillStyle = "#e8e8ee";
      ctx.beginPath(); ctx.arc(hx, hy, 3.6, 0, TAU); ctx.fill();
    } else {
      const bx = x + Math.cos(angle) * (r + 8), by = y - r * 0.05 + Math.sin(angle) * (r + 6);
      drawBowShape(bx, by, angle, st.pull, st.recoil, st.glow, st.switchS);
      if (st.glow) glowAt(bx, by, st.glow, 22, 0.28 + 0.1 * Math.sin(time * 8));
      if (st.pull > 0.02) {
        const col = st.glow || "#9fe8ff", sc = st.switchS;
        const tipx = bx + Math.cos(angle) * (34 - st.pull * 22) * sc, tipy = by + Math.sin(angle) * (34 - st.pull * 22) * sc;
        glowAt(tipx, tipy, col, 8 + st.pull * 14, 0.15 + st.pull * 0.4);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = col; ctx.globalAlpha = 0.2 + 0.3 * st.pull; ctx.lineWidth = 1.8; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(bx, by, 46, -Math.PI / 2, -Math.PI / 2 + st.pull * TAU); ctx.stroke();
        ctx.restore();
        if (st.pull > 0.97) { glowAt(tipx, tipy, col, 22, 0.6); drawStar(tipx, tipy, 5 + 1.5 * Math.sin(time * 30), time * 6, "#ffffff"); }
      }
      ctx.fillStyle = "#e8e8ee";
      ctx.beginPath(); ctx.arc(bx, by, 3.6, 0, TAU); ctx.fill();
    }
  }

  function drawCape(x, y, r, angle, st) {
    const sway = Math.sin(st.walk * 0.7) * 3 - Math.cos(angle) * 4 + Math.sin(time * 2) * 1.5;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - r * 0.7, y + r * 0.05);
    ctx.lineTo(x + r * 0.7, y + r * 0.05);
    ctx.lineTo(x + r * 1.0 + sway, y + r * 1.65);
    ctx.quadraticCurveTo(x + sway * 0.5, y + r * 1.45, x - r * 1.0 + sway, y + r * 1.65);
    ctx.closePath();
    ctx.fillStyle = look.accent; ctx.fill();
    const g = ctx.createLinearGradient(0, y, 0, y + r * 1.65);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.5)");
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }

  function drawScarf(x, y, r, angle, st) {
    ctx.save();
    ctx.strokeStyle = look.accent; ctx.lineCap = "round";
    ctx.lineWidth = r * 0.34;
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.1, r * 0.62, r * 0.2, 0, 0.1, Math.PI - 0.1); ctx.stroke();
    const bx = x - Math.cos(angle) * r * 0.5, by = y + r * 0.2;
    const w1 = Math.sin(time * 6 + st.walk * 0.3) * 4;
    ctx.lineWidth = r * 0.3;
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx - Math.cos(angle) * r * 0.9, by + r * 0.1 + w1, bx - Math.cos(angle) * r * 1.7, by + r * 0.5 + w1 * 1.4);
    ctx.stroke();
    ctx.restore();
  }

  function drawHeadwear(hx, hy, r, angle) {
    const kind = look.head;
    if (kind === "none") return;
    const R = r * 0.85, a = look.accent;
    ctx.save();
    ctx.lineJoin = "round";
    ctx.fillStyle = a; ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 1.5;
    if (kind === "band") {
      ctx.save();
      ctx.beginPath(); ctx.arc(hx, hy, R + 0.5, 0, TAU); ctx.clip();
      ctx.fillRect(hx - R, hy - R * 0.62, R * 2, R * 0.3);
      ctx.restore();
      const tx = hx - Math.cos(angle) * R * 0.95, ty = hy - R * 0.47, w = Math.sin(time * 6) * 3;
      const dir = Math.cos(angle) >= 0 ? -1 : 1;
      ctx.beginPath(); ctx.moveTo(tx, ty - 3); ctx.lineTo(tx + dir * R * 0.9, ty - 6 + w); ctx.lineTo(tx + dir * R * 0.8, ty + 4 + w); ctx.closePath(); ctx.fill();
    } else if (kind === "crown") {
      const by = hy - R * 0.72;
      ctx.beginPath();
      ctx.moveTo(hx - R * 0.7, by); ctx.lineTo(hx - R * 0.75, by - R * 0.7); ctx.lineTo(hx - R * 0.35, by - R * 0.35);
      ctx.lineTo(hx, by - R * 0.85); ctx.lineTo(hx + R * 0.35, by - R * 0.35); ctx.lineTo(hx + R * 0.75, by - R * 0.7);
      ctx.lineTo(hx + R * 0.7, by); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath(); ctx.arc(hx, by - R * 0.25, R * 0.1, 0, TAU); ctx.fill();
    } else if (kind === "horns") {
      for (const sd of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(hx + sd * R * 0.45, hy - R * 0.75);
        ctx.quadraticCurveTo(hx + sd * R * 1.25, hy - R * 0.8, hx + sd * R * 1.1, hy - R * 1.7);
        ctx.quadraticCurveTo(hx + sd * R * 0.8, hy - R * 1.0, hx + sd * R * 0.9, hy - R * 0.55);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if (kind === "wizard") {
      ctx.beginPath(); ctx.moveTo(hx - R * 0.8, hy - R * 0.45); ctx.lineTo(hx + R * 0.15, hy - R * 2.1); ctx.lineTo(hx + R * 0.8, hy - R * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(hx, hy - R * 0.45, R * 1.25, R * 0.28, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.fillRect(hx - R * 0.62, hy - R * 0.78, R * 1.24, R * 0.2);
    }
    ctx.restore();
  }

  function drawHero(x, y, r, angle, st, flash) {
    const bob = st.moving ? Math.abs(Math.sin(st.walk * 0.5)) * -2 : 0;
    if (!st.noShadow) drawShadow(x, y, r);
    if (look.back === "cape") drawCape(x, y + bob, r, angle, st);
    const behind = Math.sin(angle) < -0.4;
    if (behind) drawWeapon(x, y + bob, r, angle, st);
    drawBody(x, y + bob, r, look.mask, look.body, "#0d0d10", "#4a6ad0", angle, flash, st.walk, 1, look);
    if (look.back === "scarf") drawScarf(x, y + bob, r, angle, st);
    drawHeadwear(x, y + bob - r * 0.2, r, angle);
    if (!behind) drawWeapon(x, y + bob, r, angle, st);
  }

  function heroState() {
    const p = player;
    const eq = p.equipped[p.weapon];
    const st = {
      weapon: p.weapon, reach: p.reach, arc: p.arc, glow: spellColor(eq), colors: spellColors(eq),
      walk: p.walk, moving: p.moving, swingU: -1, swingDir: 1, pull: 0, recoil: p.bow.recoil, switchS: 1,
    };
    if (p.swing) { st.swingU = clamp(p.swing.t / p.swing.dur, 0, 1); st.swingDir = p.swing.dir; }
    if (p.bow.phase === 1) st.pull = clamp(p.bow.t / p.drawTime, 0, 1);
    if (p.switchT > 0) st.switchS = easeOut(1 - p.switchT / 0.3);
    return st;
  }

  function drawPlayer() {
    const p = player;
    const eq = p.equipped[p.weapon];
    // magic circle under feet
    if (eq.length || p.castT > 0) {
      const c = p.castT > 0 ? p.castColor : spellColor(eq);
      drawRune(p.x, p.y + p.r * 1.3, p.castT > 0 ? 44 : 30, c, time * 1.4, p.castT > 0 ? 0.9 : 0.35, 0.36);
    }
    if (p.slowT > 0) {
      ctx.fillStyle = "rgba(120,210,255,.25)";
      ctx.beginPath(); ctx.arc(p.x, p.y + 4, p.r * 1.5, 0, TAU); ctx.fill();
    }
    if (p.roll) {
      // Elden Ring style tumble: curl up and somersault along the roll direction
      const rl = p.roll, u = clamp(rl.t / rl.dur, 0, 1);
      const dirSign = Math.cos(rl.a) >= 0 ? 1 : -1;
      drawShadow(p.x, p.y, p.r * (0.9 - 0.15 * Math.sin(u * Math.PI)));
      const st2 = heroState(); st2.noWeapon = true; st2.noShadow = true; st2.moving = false;
      ctx.save();
      ctx.translate(p.x, p.y + p.r * 0.5);
      ctx.rotate(dirSign * easeInOut(u) * TAU * 1.0);
      const sq = 0.82 + 0.1 * Math.sin(u * Math.PI);
      ctx.scale(sq, sq);
      drawHero(0, -p.r * 0.5, p.r, 0, st2, false);
      ctx.restore();
      return;
    }
    if (p.invuln > 0 && Math.floor(p.invuln * 22) % 2 === 1) return;
    const st = heroState();
    let ox = 0, oy = 0;
    if (p.swing) {
      const lunge = Math.sin(clamp(p.swing.t / p.swing.dur, 0, 1) * Math.PI) * 9;
      ox = Math.cos(p.angle) * lunge; oy = Math.sin(p.angle) * lunge;
    }
    if (p.bow.recoil > 0) { ox -= Math.cos(p.angle) * p.bow.recoil * 40; oy -= Math.sin(p.angle) * p.bow.recoil * 40; }
    drawHero(p.x + ox, p.y + oy, p.r, p.angle, st, false);
    if (p.castT > 0) glowAt(p.x + Math.cos(p.angle) * 24, p.y + Math.sin(p.angle) * 24, p.castColor, 36 * (p.castT / 0.4) + 10, 0.9);
    if (p.parry) {
      const u = p.parry.t / p.parry.end, active = p.parry.t < p.parry.win;
      ctx.save();
      ctx.translate(p.x, p.y + 2); ctx.rotate(p.angle);
      ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
      ctx.strokeStyle = active ? "#fff4c0" : "#8a8aa0";
      ctx.globalAlpha = active ? 0.95 : 0.45 * (1 - u);
      ctx.lineWidth = active ? 5 : 2;
      ctx.beginPath(); ctx.arc(0, 0, 38, -1.0, 1.0); ctx.stroke();
      if (active) {
        ctx.globalAlpha = 0.3; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(0, 0, 38, -1.0, 1.0); ctx.stroke();
        ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 46, -0.8, 0.8); ctx.stroke();
      }
      ctx.restore();
      if (active) glowAt(p.x + Math.cos(p.angle) * 38, p.y + Math.sin(p.angle) * 38, "#fff4c0", 26, 0.8);
    }
  }

  // =====================================================================
  //  ENEMY DRAWING
  // =====================================================================
  function drawStar(x, y, s, rot, color) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4, rr = k % 2 === 0 ? s : s * 0.3;
      if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawEnemyAcc(e) {
    const r = e.r, x = e.x, y = e.y, hy = y - r * 0.2, R = r * 0.85;
    switch (e.def.acc) {
      case "band":
        ctx.fillStyle = "#e83030"; ctx.fillRect(x - R, hy - R * 0.55, R * 2, R * 0.22);
        break;
      case "pads":
        ctx.fillStyle = "#4a4a58";
        ctx.beginPath(); ctx.arc(x - r * 0.95, y + r * 0.25, r * 0.3, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(x + r * 0.95, y + r * 0.25, r * 0.3, 0, TAU); ctx.fill();
        break;
      case "hood":
        ctx.strokeStyle = "#2f6a3a"; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(x, hy, R + 2, Math.PI * 0.92, Math.PI * 2.08); ctx.stroke();
        ctx.fillStyle = "#2f6a3a";
        ctx.beginPath(); ctx.moveTo(x - R * 0.55, hy - R * 0.95); ctx.lineTo(x + R * 0.1, hy - R * 1.7); ctx.lineTo(x + R * 0.55, hy - R * 0.95); ctx.closePath(); ctx.fill();
        break;
      case "bomb": {
        const bx = x + r * 1.0, by = y + r * 0.75;
        ctx.fillStyle = "#101010"; ctx.beginPath(); ctx.arc(bx, by, r * 0.45, 0, TAU); ctx.fill();
        ctx.strokeStyle = "#7a5a30"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by - r * 0.45); ctx.lineTo(bx + 3, by - r * 0.85); ctx.stroke();
        glowAt(bx + 3, by - r * 0.9, e.fuse > 0 ? "#ffffff" : "#ffa020", 8 + 6 * Math.sin(time * (e.fuse > 0 ? 40 : 14)), 0.9);
        break;
      }
      case "horns":
        ctx.fillStyle = "#c04040";
        for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + sd * R * 0.5, hy - R * 0.7); ctx.lineTo(x + sd * R * 1.1, hy - R * 1.5); ctx.lineTo(x + sd * R * 0.85, hy - R * 0.5); ctx.closePath(); ctx.fill(); }
        break;
      case "shield": {
        ctx.save();
        ctx.translate(x, y + r * 0.2); ctx.rotate(e.shieldAng);
        ctx.fillStyle = "#6a7a9a"; rrect(r + 2, -r * 0.95, 11, r * 1.9, 4); ctx.fill();
        ctx.strokeStyle = "#cfe0ff"; ctx.lineWidth = 2; rrect(r + 2, -r * 0.95, 11, r * 1.9, 4); ctx.stroke();
        ctx.fillStyle = "#9fb4ff"; ctx.fillRect(r + 5, -4, 5, 8);
        ctx.restore();
        break;
      }
      case "cross":
        ctx.fillStyle = "#60ff9a";
        ctx.fillRect(x - 2.5, hy - R - 15, 5, 14); ctx.fillRect(x - 7, hy - R - 11, 14, 5);
        glowAt(x, hy - R - 9, "#60ff9a", 14, 0.5);
        break;
      case "orbs":
        for (let i = 0; i < 3; i++) {
          const a = time * 3 + (i * TAU) / 3;
          const ox = x + Math.cos(a) * (r + 12), oy = y + Math.sin(a) * (r * 0.5 + 8) - r * 0.2;
          glowAt(ox, oy, "#d060ff", 12, 0.9);
          ctx.fillStyle = "#f0c0ff"; ctx.beginPath(); ctx.arc(ox, oy, 3, 0, TAU); ctx.fill();
        }
        break;
      case "wizhat":
        ctx.fillStyle = "#4a1a6a"; ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x - R * 0.8, hy - R * 0.5); ctx.lineTo(x + R * 0.15, hy - R * 2.0); ctx.lineTo(x + R * 0.8, hy - R * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x, hy - R * 0.5, R * 1.2, R * 0.26, 0, 0, TAU); ctx.fill(); ctx.stroke();
        drawStar(x + R * 0.1, hy - R * 1.2, 3.5, time, "#ffd0ff");
        break;
      case "plates":
        ctx.fillStyle = "#7a7a86";
        rrect(x - r * 0.55, y + r * 0.15, r * 1.1, r * 0.8, 4); ctx.fill();
        ctx.strokeStyle = "#a8a8b6"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, hy, R + 1, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
        ctx.beginPath(); ctx.arc(x - r * 0.95, y + r * 0.25, r * 0.34, 0, TAU); ctx.fillStyle = "#8a8a96"; ctx.fill();
        ctx.beginPath(); ctx.arc(x + r * 0.95, y + r * 0.25, r * 0.34, 0, TAU); ctx.fill();
        break;
      case "fangs":
        ctx.fillStyle = "#ffffff";
        for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + sd * R * 0.25 - 2.5, hy + R * 0.45); ctx.lineTo(x + sd * R * 0.25 + 2.5, hy + R * 0.45); ctx.lineTo(x + sd * R * 0.25, hy + R * 0.85); ctx.closePath(); ctx.fill(); }
        break;
      case "icecrown":
        ctx.fillStyle = "#bfeaff"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
        for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(x + k * R * 0.5 - 4, hy - R * 0.75); ctx.lineTo(x + k * R * 0.5, hy - R * (1.25 + (k === 0 ? 0.3 : 0))); ctx.lineTo(x + k * R * 0.5 + 4, hy - R * 0.75); ctx.closePath(); ctx.fill(); ctx.stroke(); }
        break;
      case "flames":
        for (let k = -1; k <= 1; k++) glowAt(x + k * R * 0.55, hy - R * (0.95 + 0.2 * Math.sin(time * 12 + k)), k === 0 ? "#ffd24a" : "#ff7a1a", 14, 0.85);
        break;
      case "scar":
        ctx.strokeStyle = "#ff3030"; ctx.lineWidth = 3; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x - R * 0.7, hy - R * 0.6); ctx.lineTo(x + R * 0.4, hy + R * 0.7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - R * 0.3, hy - R * 0.7); ctx.lineTo(x + R * 0.7, hy + R * 0.3); ctx.stroke();
        break;
      case "axe": {
        const ax = x + r * 1.05, ay = y - r * 0.3;
        ctx.strokeStyle = "#6a4a2a"; ctx.lineWidth = 4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(ax - 8, ay + r * 1.3); ctx.lineTo(ax + 8, ay - r * 0.9); ctx.stroke();
        ctx.fillStyle = "#b8bcc8";
        ctx.beginPath(); ctx.moveTo(ax + 8, ay - r * 0.9); ctx.lineTo(ax + r * 0.9, ay - r * 0.6); ctx.lineTo(ax + r * 0.8, ay + r * 0.2); ctx.lineTo(ax + 4, ay - r * 0.2); ctx.closePath(); ctx.fill();
        break;
      }
      default:
    }
  }

  function drawEnemy(e) {
    const spawn = e.spawnT > 0 ? 1 - e.spawnT / 0.35 : 1;
    const st = e.boss ? e.style : e.def;
    ctx.save();
    ctx.globalAlpha = spawn * (e.alpha == null ? 1 : e.alpha);
    drawShadow(e.x, e.y, e.r, e.boss ? 1.1 : 1);
    if (e.elite) {
      glowAt(e.x, e.y, "#ffd060", e.r * 2.6, 0.45 + 0.2 * Math.sin(time * 5));
      ctx.strokeStyle = "rgba(255,210,96,.8)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y + e.r * 0.2, e.r * 1.35, 0, TAU); ctx.stroke();
    }
    if (e.boss) glowAt(e.x, e.y, e.style.glow, e.r * 2.8, 0.25 + 0.12 * Math.sin(time * 4));
    if (e.burn) glowAt(e.x, e.y, "#ff7a1a", e.r * 2.3, 0.4 + 0.15 * Math.sin(time * 18));
    if (e.poison) glowAt(e.x, e.y, "#7dff5a", e.r * 2.0, 0.3);
    if (e.slow) {
      ctx.fillStyle = "rgba(120,210,255,.26)";
      ctx.beginPath(); ctx.arc(e.x, e.y + e.r * 0.2, e.r * 1.3, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(200,240,255,.9)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#dff6ff";
      for (let k = 0; k < 6; k++) {
        const a = (k * TAU) / 6 + 0.3, cx = e.x + Math.cos(a) * e.r * 1.2, cy = e.y + e.r * 0.2 + Math.sin(a) * e.r * 1.2;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 7, cy + Math.sin(a) * 7); ctx.lineTo(cx + Math.cos(a + 2.1) * 3.5, cy + Math.sin(a + 2.1) * 3.5); ctx.lineTo(cx + Math.cos(a - 2.1) * 3.5, cy + Math.sin(a - 2.1) * 3.5); ctx.closePath(); ctx.fill();
      }
    }
    const wide = e.def.id === "brute" || e.def.id === "jugg" || e.def.id === "executioner" ? 1.25 : 1;
    const flashing = e.flash > 0 || (e.fuse > 0 && Math.floor(time * 20) % 2 === 0);
    drawBody(e.x, e.y, e.r, st.mask, st.body, st.eye, "rgba(255,255,255,.18)", e.angle, flashing, e.walk, wide);
    if (e.boss) {
      ctx.fillStyle = e.style.horn;
      ctx.beginPath(); ctx.moveTo(e.x - 42, e.y - 30); ctx.lineTo(e.x - 30, e.y - 78); ctx.lineTo(e.x - 14, e.y - 44); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(e.x + 42, e.y - 30); ctx.lineTo(e.x + 30, e.y - 78); ctx.lineTo(e.x + 14, e.y - 44); ctx.closePath(); ctx.fill();
    } else drawEnemyAcc(e);
    if (e.stun > 0) for (let k = 0; k < 3; k++) drawStar(e.x + Math.cos(time * 6 + (k * TAU) / 3) * e.r * 0.8, e.y - e.r * 1.35 + Math.sin(time * 6 + (k * TAU) / 3) * 3, 4, time * 3, "#ffe44a");
    if (!e.boss && e.hp < e.maxHp) bar(e.x - 17, e.y - e.r - 20, 34, 6, e.hp / e.maxHp, e.elite ? "#ffd060" : "#ff5a5a", e.elite ? "#c08a20" : "#c02a2a");
    if (access.cues) {
      if (e.elite) {
        ctx.save();
        ctx.setLineDash([8, 6]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(e.x, e.y + e.r * 0.2, e.r * 1.35, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      const icons = [];
      if (e.burn) icons.push("flame");
      if (e.poison) icons.push("skull");
      if (e.slow) icons.push("snow");
      if (e.stun > 0) icons.push("burst");
      if (e.elite) icons.push("star");
      const baseY = e.y - e.r - (e.boss ? 84 : 34);
      icons.forEach((ic, i) => {
        const ix = e.x + (i - (icons.length - 1) / 2) * 17;
        ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.beginPath(); ctx.arc(ix, baseY, 9, 0, TAU); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2; ctx.stroke();
        drawIcon(ic, ix, baseY, 5.5, "#ffffff");
      });
    }
    ctx.restore();
  }

  // =====================================================================
  //  WORLD EFFECTS
  // =====================================================================
  function drawBg() {
    ctx.fillStyle = "#1b1b24";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#232331"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 620);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawCoins() {
    for (const c of coins) {
      const big = c.v >= 10 ? 2 : 0;
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, 6 + big, 2.5, 0, 0, TAU); ctx.fill();
      const sx = Math.max(0.15, Math.abs(Math.cos(c.t * 6)));
      ctx.save();
      ctx.translate(c.x, c.y - c.z - 6);
      ctx.shadowColor = "rgba(255,210,60,.85)"; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.ellipse(0, 0, (7 + big) * sx, 7 + big, 0, 0, TAU);
      ctx.fillStyle = "#ffd23c"; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#b07d00"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, (4 + big * 0.6) * sx, 4 + big * 0.6, 0, 0, TAU);
      ctx.strokeStyle = "rgba(176,125,0,.7)"; ctx.stroke();
      ctx.restore();
    }
  }

  function drawTelegraphOne(t) {
    const f = clamp(t.t / t.dur, 0, 1), cues = access.cues;
    let mx, my;
    ctx.save();
    if (t.kind === "line") {
      const ang = Math.atan2(t.y2 - t.y, t.x2 - t.x), len = Math.hypot(t.x2 - t.x, t.y2 - t.y);
      mx = (t.x + t.x2) / 2; my = (t.y + t.y2) / 2;
      ctx.translate(t.x, t.y); ctx.rotate(ang);
      ctx.fillStyle = t.color;
      ctx.globalAlpha = 0.12 + 0.2 * f; ctx.fillRect(0, -t.w / 2, len, t.w);
      ctx.globalAlpha = 0.3; ctx.fillRect(0, -t.w / 2, len * f, t.w);
      ctx.globalAlpha = 0.8; ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.strokeRect(0, -t.w / 2, len, t.w);
      if (cues) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0, -t.w / 2, len, t.w); ctx.clip();
        ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 3; ctx.globalAlpha = 1;
        const off = (time * 40) % 26;
        for (let sx = -t.w + off; sx < len + t.w; sx += 26) { ctx.beginPath(); ctx.moveTo(sx, -t.w / 2); ctx.lineTo(sx + t.w, t.w / 2); ctx.stroke(); }
        ctx.restore();
        ctx.setLineDash([12, 7]); ctx.lineWidth = 3.5; ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.95;
        ctx.strokeRect(0, -t.w / 2, len, t.w);
        ctx.setLineDash([]);
      }
    } else {
      mx = t.x; my = t.y;
      ctx.fillStyle = t.color; ctx.strokeStyle = t.color;
      ctx.globalAlpha = 0.1 + 0.25 * f;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.85; ctx.lineWidth = 3; ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r * f, 0, TAU); ctx.stroke();
      if (cues) {
        ctx.save();
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.clip();
        ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 3; ctx.globalAlpha = 1;
        const off = (time * 40) % 26;
        for (let sx = t.x - t.r * 2 + off; sx < t.x + t.r * 2; sx += 26) { ctx.beginPath(); ctx.moveTo(sx, t.y - t.r); ctx.lineTo(sx + t.r * 2, t.y + t.r); ctx.stroke(); }
        ctx.restore();
        ctx.setLineDash([12, 7]); ctx.lineWidth = 3.5; ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.95;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
    if (cues) outlined("!", 26, "#ffffff", mx, my - 14, "center");
  }

  function drawTelegraphs() {
    for (const t of telegraphs) drawTelegraphOne(t);
  }

  function drawHazards() {
    for (const h of hazards) {
      const f = clamp(h.t / h.max, 0, 1);
      ctx.fillStyle = `rgba(60,20,0,${0.35 * f})`;
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.55, 0, 0, TAU); ctx.fill();
      glowAt(h.x, h.y, "#ff7a1a", h.r * 1.7, 0.6 * f + 0.1 * Math.sin(time * 14));
      glowAt(h.x, h.y, "#ffd24a", h.r * 0.8, 0.45 * f);
      if (access.cues) {
        ctx.save();
        ctx.setLineDash([6, 5]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + 0.4 * f;
        ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.55, 0, 0, TAU); ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = 0.5 + 0.4 * f;
        drawIcon("flame", h.x, h.y, 6, "#ffffff");
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawRings() {
    for (const r of rings) {
      const f = clamp(r.t / r.dur, 0, 1), e = easeOut(f);
      const rad = lerp(r.r, r.max, e);
      let cx = r.x, cy = r.y;
      if (r.follow && player) { cx = player.x; cy = player.y + player.r * 1.3; }
      ctx.save();
      if (r.kind === "rune") {
        drawRune(cx, cy, rad, r.color, f * 3, (1 - f) * 0.95, r.follow ? 0.36 : 0.6);
      } else if (r.kind === "shock") {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = (1 - f) * 0.6;
        ctx.drawImage(glowSprite(r.color), cx - rad * 1.15, cy - rad * 1.15, rad * 2.3, rad * 2.3);
        ctx.globalAlpha = (1 - f);
        ctx.strokeStyle = r.color; ctx.lineWidth = 9 * (1 - f) + 2;
        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, TAU); ctx.stroke();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2 * (1 - f) + 1;
        ctx.beginPath(); ctx.arc(cx, cy, rad * 0.97, 0, TAU); ctx.stroke();
      } else {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = (1 - f) * 0.9;
        ctx.strokeStyle = r.color; ctx.lineWidth = 4 * (1 - f) + 1;
        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, TAU); ctx.stroke();
        ctx.globalAlpha = (1 - f) * 0.2; ctx.fillStyle = r.color; ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawBolts() {
    for (const b of bolts) {
      const f = clamp(b.t / b.max, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      const path = (pts) => { ctx.beginPath(); pts.forEach((pt, i) => (i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]))); ctx.stroke(); };
      ctx.strokeStyle = b.color; ctx.globalAlpha = 0.4 * f; ctx.lineWidth = b.w * 3.2; path(b.pts);
      ctx.globalAlpha = 0.9 * f; ctx.lineWidth = b.w; path(b.pts);
      ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = f; ctx.lineWidth = Math.max(1, b.w * 0.45); path(b.pts);
      ctx.strokeStyle = b.color; ctx.globalAlpha = 0.7 * f; ctx.lineWidth = Math.max(1, b.w * 0.5);
      for (const br of b.branches) path(br);
      ctx.restore();
    }
  }

  function drawBeams() {
    for (const b of beams) {
      const f = clamp(b.t / b.max, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
      const line = () => { ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); };
      ctx.strokeStyle = b.color;
      ctx.globalAlpha = 0.28 * f; ctx.lineWidth = b.w * 1.7 * f + 4; line();
      ctx.globalAlpha = 0.55 * f; ctx.lineWidth = b.w * 0.65 * f + 2; line();
      for (let k = 0; k < 3; k++) {
        const pts = makeBolt(b.x1, b.y1, b.x2, b.y2, 24, 16 * f + 4);
        ctx.beginPath(); pts.forEach((pt, i) => (i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])));
        ctx.strokeStyle = k === 0 ? "#ffffff" : b.color; ctx.globalAlpha = f * (0.95 - 0.25 * k); ctx.lineWidth = 3 - k * 0.7; ctx.stroke();
      }
      ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = f; ctx.lineWidth = b.w * 0.2 * f + 1; line();
      ctx.restore();
      glowAt(b.x1, b.y1, "#ffffff", 56 * f + 10, 0.85);
    }
  }

  function drawShots() {
    for (const s of shots) {
      if (s.type === "fireball") {
        glowAt(s.x, s.y, "#ff5a1a", 60, 0.7);
        glowAt(s.x, s.y, "#ff9a2a", 40, 0.95);
        glowAt(s.x, s.y, "#ffd24a", 26, 1);
        for (let i = 0; i < 6; i++) {
          const a = time * 10 + (i * TAU) / 6;
          glowAt(s.x + Math.cos(a) * 14, s.y + Math.sin(a) * 14, "#ffb04a", 11, 0.85);
        }
        glowAt(s.x, s.y, "#ffffff", 14, 1);
      } else if (s.type === "lance") {
        ctx.save();
        ctx.translate(s.x, s.y); ctx.rotate(s.ang);
        glowAt(0, 0, "#58c8ff", 46, 0.8);
        const g = ctx.createLinearGradient(-36, 0, 64, 0);
        g.addColorStop(0, "#58c8ff"); g.addColorStop(0.6, "#cdeeff"); g.addColorStop(1, "#ffffff");
        ctx.fillStyle = g; ctx.shadowColor = "#58c8ff"; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.moveTo(66, 0); ctx.lineTo(-20, -9); ctx.lineTo(-38, 0); ctx.lineTo(-20, 9); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.8)";
        for (const ox of [-4, 14, 32]) { ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox + 5, -4); ctx.lineTo(ox + 10, 0); ctx.lineTo(ox + 5, 4); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      } else if (s.type === "missile") {
        glowAt(s.x, s.y, "#b97bff", 34, 0.9);
        drawStar(s.x, s.y, 9, time * 8 + s.t * 5, "#ffffff");
        glowAt(s.x, s.y, "#ffffff", 10, 1);
      } else if (s.type === "scythe") {
        ctx.save();
        ctx.translate(s.x, s.y); ctx.rotate(s.spin);
        glowAt(0, 0, "#9b4dff", 66, 0.6);
        ctx.shadowColor = "#b97bff"; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.arc(0, 0, 36, -2.4, 0.9); ctx.arc(9, -5, 29, 0.9, -2.4, true); ctx.closePath();
        ctx.fillStyle = "#2b1245"; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#e0c8ff"; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, 33, -2.2, 0.7); ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawArrows() {
    for (const a of arrows) {
      const base = a.reflected ? "#ffe27a" : spellColor(a.sp) || "#9fe8ff";
      const n = a.trail.length;
      ctx.save();
      ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
      for (let i = 1; i < n; i++) {
        const f = i / n;
        ctx.strokeStyle = base; ctx.globalAlpha = f * 0.32; ctx.lineWidth = 6 * f;
        ctx.beginPath(); ctx.moveTo(a.trail[i - 1][0], a.trail[i - 1][1]); ctx.lineTo(a.trail[i][0], a.trail[i][1]); ctx.stroke();
        ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = f * 0.6; ctx.lineWidth = 1.5 * f;
        ctx.beginPath(); ctx.moveTo(a.trail[i - 1][0], a.trail[i - 1][1]); ctx.lineTo(a.trail[i][0], a.trail[i][1]); ctx.stroke();
      }
      ctx.restore();
      ctx.save();
      ctx.translate(a.x, a.y); ctx.rotate(a.ang);
      drawArrowLocal(-22, 34, base);
      ctx.restore();
      glowAt(a.x, a.y, base, 16, 0.55);
      if (a.boom) glowAt(a.x, a.y, "#ff9a2a", 13, 0.5);
    }
  }
  function drawEBullet(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    if (access.cues) {
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 4);
      const s = b.r * 1.3;
      ctx.shadowColor = b.color; ctx.shadowBlur = 8;
      ctx.fillStyle = "#101018"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.rect(-s, -s, s * 2, s * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.rect(-s * 0.5, -s * 0.5, s, s); ctx.fill();
    } else {
      ctx.shadowColor = b.color; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU);
      ctx.fillStyle = b.color; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0, 0, b.r * 0.42, 0, TAU); ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.85; ctx.fill();
    }
    ctx.restore();
  }

  function drawWorld() {
    const p = player;
    drawBg();
    drawHazards();
    drawCoins();
    drawTelegraphs();
    const list = enemies.map((e) => ({ y: e.y, fn: () => drawEnemy(e) }));
    list.push({ y: p.y, fn: drawPlayer });
    list.sort((a, b) => a.y - b.y);
    for (const d of list) d.fn();
    drawArrows();
    drawShots();
    drawBeams();

    for (const b of eBullets) drawEBullet(b);

    drawRings();
    drawBolts();
    drawParticles();
    for (const t of texts) {
      ctx.globalAlpha = clamp(t.t / 0.3, 0, 1);
      outlined(t.s, t.size, t.color, t.x, t.y, "center");
    }
    ctx.globalAlpha = 1;
  }

  // =====================================================================
  //  HUD
  // =====================================================================
  function weaponSlot(x, y, w, key, label) {
    const p = player;
    const active = p.weapon === key;
    const sps = p.equipped[key], sc = spellColor(sps);
    ctx.globalAlpha = active ? 1 : 0.65;
    panel(x, y, w, w, active ? "rgba(30,30,48,.85)" : "rgba(10,10,16,.65)", active ? (sc || "#ffffff") : "rgba(255,255,255,.2)", 12);
    drawIcon(key === "sword" ? "sword" : "bow", x + w / 2, y + w / 2 - 2, w * 0.3, active ? "#ffffff" : "#aaaabb");
    text(label, 13, "#cfd0dd", x + 8, y + 6);
    sps.forEach((k, i) => {
      const gy = y + 14 + i * 17;
      ctx.beginPath(); ctx.arc(x + w - 14, gy, 8, 0, TAU);
      ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
      drawIcon(SPELLS[k].icon, x + w - 14, gy, 5.5, SPELLS[k].color);
    });
    let f = 0;
    if (active) {
      if (key === "sword") f = p.atkTimer / p.swordCd;
      else if (p.bow.phase === 1) f = 1 - clamp(p.bow.t / p.drawTime, 0, 1);
    }
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x + 8, y + w - 11, w - 16, 4);
    ctx.fillStyle = active ? (sc || "#ffffff") : "#555";
    ctx.fillRect(x + 8, y + w - 11, (w - 16) * (1 - f), 4);
    ctx.globalAlpha = 1;
  }

  function bookSlot(x, y, w, i) {
    const p = player, key = p.book[i];
    const def = key ? BOOK[key] : null;
    const cd = p.bookCd[i], ready = key && cd <= 0;
    const col = def ? def.color : "#555566";
    panel(x, y, w, w, "rgba(10,10,18,.75)", ready ? col : "rgba(255,255,255,.18)", 12);
    if (ready) {
      glowAt(x + w / 2, y + w / 2, col, w * 0.7, 0.18 + 0.1 * Math.sin(time * 5));
    }
    if (def) drawIcon(def.icon, x + w / 2, y + w / 2 - 1, w * 0.28, ready ? col : "#6a6a7a");
    else text("-", 20, "#555566", x + w / 2, y + w / 2 - 12, "center");
    if (def && cd > 0) {
      const f = clamp(cd / (p.bookMax[i] || 1), 0, 1);
      ctx.save();
      rrect(x, y, w, w, 12); ctx.clip();
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x, y, w, w * f);
      ctx.restore();
      outlined(cd.toFixed(1), 14, "#ffffff", x + w / 2, y + w / 2 - 8, "center");
    }
    text(BOOK_KEY_LABEL[i], 12, ready ? "#ffffff" : "#8a8aa0", x + 7, y + 5);
  }

  function abilitySlot(x, y, w, label, icon, cd, cdMax, color, active) {
    const ready = cd <= 0 && !active;
    panel(x, y, w, w, "rgba(10,10,18,.75)", active ? "#ffffff" : ready ? color : "rgba(255,255,255,.18)", 12);
    if (ready) glowAt(x + w / 2, y + w / 2, color, w * 0.7, 0.14 + 0.08 * Math.sin(time * 5));
    drawIcon(icon, x + w / 2, y + w / 2 - 3, w * 0.26, active ? "#ffffff" : ready ? color : "#6a6a7a");
    if (cd > 0 && !active) {
      const f = clamp(cd / (cdMax || 1), 0, 1);
      ctx.save();
      rrect(x, y, w, w, 12); ctx.clip();
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x, y, w, w * f);
      ctx.restore();
    }
    text(label, 10, ready || active ? "#ffffff" : "#8a8aa0", x + w / 2, y + w - 14, "center");
  }

  function drawHUD() {
    const p = player;
    panel(12, 12, 252, 34, "rgba(10,10,16,.6)", "rgba(255,255,255,.12)", 12);
    const frac = clamp(p.hp / p.maxHp, 0, 1);
    bar(18, 18, 240, 22, frac, frac > 0.35 ? "#5be07e" : "#ff6a5a", frac > 0.35 ? "#2ea852" : "#c0382a");
    outlined(`${Math.max(0, Math.ceil(p.hp))} / ${Math.ceil(p.maxHp)}`, 14, "#fff", 138, 21, "center");
    if (access.cues) {
      ctx.save(); ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 2;
      for (const tf of [0.25, 0.5, 0.75]) { ctx.beginPath(); ctx.moveTo(18 + 240 * tf, 19); ctx.lineTo(18 + 240 * tf, 39); ctx.stroke(); }
      ctx.restore();
      if (frac < 0.35) {
        ctx.globalAlpha = 0.65 + 0.35 * Math.sin(time * 9);
        drawIcon("warn", 282, 30, 9, "#ffffff");
        outlined("LOW HP", 14, "#ffffff", 298, 22, "left");
        ctx.globalAlpha = 1;
      }
    }
    const mp = 1 + moneyPulse * 1.6;
    ctx.save(); ctx.translate(30, 66); ctx.scale(mp, mp); drawCoin(0, 0, 10); ctx.restore();
    ctx.save(); ctx.translate(46, 53); ctx.scale(mp, mp); outlined("" + p.money, 24, GOLD, 0, 0, "left"); ctx.restore();

    if (level < LEVELS_PER_CYCLE) {
      outlined(`LEVEL ${level}/${LEVELS_PER_CYCLE}`, 26, "#fff", W - 18, 12, "right");
      const bw = 200, bx = W - 18 - bw;
      bar(bx, 46, bw, 10, quota ? kills / quota : 0, "#9fb4ff", "#5c74d0");
      outlined(`${kills}/${quota} kills`, 13, "#fff", W - 18, 60, "right");
    } else {
      outlined("BOSS FIGHT!", 26, RED, W - 18, 12, "right");
    }
    if (rebirths > 0) outlined(`REBIRTH ${rebirths}  x${p.mult} upgrades`, 13, GOLD, W - 18, 80, "right");

    if (boss && enemies.includes(boss)) {
      const bw = 420, bx = W / 2 - bw / 2 + 10;
      bar(bx, 12, bw, 18, boss.hp / boss.maxHp, boss.style.glow, "#601010");
      outlined(boss.style.name.toUpperCase() + `  (phase ${boss.phase})`, 13, "#fff", bx + bw / 2, 33, "center");
    }

    weaponSlot(14, H - 82, 66, "sword", "1");
    weaponSlot(88, H - 82, 66, "bow", "2");
    for (let i = 0; i < 3; i++) bookSlot(170 + i * 62, H - 76, 56, i);
    abilitySlot(370, H - 76, 56, "SPACE", "roll", p.rollCd, 0.45, "#9fb4ff", !!p.roll);
    abilitySlot(432, H - 76, 56, "F", "parry", p.parryCd, 0.95, "#ffe27a", !!p.parry && p.parry.t < p.parry.win);

    if (banner) {
      const a = clamp(banner.t * 2, 0, 1);
      ctx.globalAlpha = a;
      outlined(banner.text, 58, banner.color, W / 2, 110, "center");
      outlined(banner.sub, 20, "#dcdcea", W / 2, 178, "center");
      ctx.globalAlpha = 1;
    }
  }

  function drawPlayScene() {
    ctx.save();
    if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawWorld();
    ctx.restore();
    if (hurtFlash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 640);
      g.addColorStop(0, "rgba(255,0,0,0)"); g.addColorStop(1, `rgba(255,30,30,${hurtFlash * 0.9})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (access.cues && hurtFlash > 0) {
      ctx.save(); ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = clamp(hurtFlash * 1.8, 0, 0.9); ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10); ctx.restore();
    }
    if (flashScreen > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = clamp(flashScreen * 0.5, 0, 0.5);
      ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    drawHUD();
  }

  // =====================================================================
  //  SHOP
  // =====================================================================
  function itemLevel(it) { return player.lv[it.id] || 0; }
  function itemCost(it) {
    if (it.id === "heal") return 15 + level * 4;
    const lv = itemLevel(it);
    return lv >= it.max ? null : Math.floor(it.base * Math.pow(it.grow, lv));
  }
  function fmt(v, it) { return it.dec ? v.toFixed(it.dec) : String(Math.round(v)); }
  function stepAnim(id, target) { uiA[id] = lerp(uiA[id] || 0, target ? 1 : 0, 0.28); return uiA[id]; }
  function deny(id) { uiS[id] = 1; sfx.deny(); }
  function addHit(x, y, w, h, fn) { hits.push({ x, y, w, h, fn }); }

  function emitSpellFx(sp, x, y) {
    const c = SPELLS[sp].color;
    if (sp === "fire") { glows(x, y, 1, "#ff7a1a", 20, 0.5, 14, -80); if (Math.random() < 0.3) glows(x, y, 1, "#ffd24a", 10, 0.35, 8, -90); }
    else if (sp === "frost") P({ x, y, vx: rand(-15, 15), vy: rand(-10, 20), life: 0.7, size: 2.6, color: "#cdeeff", kind: "shard", vr: rand(-4, 4) });
    else if (sp === "storm") sparks(x, y, 1, "#fff6a8", 150, 0.2, 1.8);
    else if (sp === "vamp") P({ x, y, vx: 0, vy: 10, life: 0.7, size: 2.6, color: "#a01a35", grav: 300 });
    else if (sp === "arcane") starPuffs(x, y, 1, "#d7aaff", 20, 0.6, 5);
    else if (sp === "venom") P({ x, y, vx: rand(-8, 8), vy: -20, life: 0.8, size: rand(2, 4), color: "#7dff5a", drag: 0.5 });
    else if (sp === "gale") P({ x, y, vx: rand(-90, 90), vy: rand(-90, 90), life: 0.3, size: 1.8, color: "#d8fff4", kind: "spark", add: true });
    else smokePuff(x, y, 1, "#1a0a2a", 14, 0.8, 8);

  function buyItem(it, id, cx, cy) {
    const p = player, c = itemCost(it);
    if (c === null) { deny(id); return; }
    if (it.consumable && p.hp >= p.maxHp) { deny(id); return; }
    if (p.money < c) { deny(id); return; }
    p.money -= c;
    it.apply(p);
    if (!it.consumable) p.lv[it.id] = itemLevel(it) + 1;
    uiF[id] = 1;
    sfx.buy();
    burst(cx, cy, 22, GOLD, 240, 0.7, 3.2, 260);
    burst(cx, cy, 10, "#ffffff", 180, 0.5, 2.4);
  }

  function buySpell(key, id, cx, cy) {
    const p = player, lv = p.spells[key];
    if (lv >= 3) { deny(id); return; }
    const c = SPELLS[key].costs[lv];
    if (p.money < c) { deny(id); return; }
    p.money -= c;
    p.spells[key]++;
    if (lv === 0) {
      if (p.equipped.sword.length < p.slots.sword) p.equipped.sword.push(key);
      else if (p.equipped.bow.length < p.slots.bow) p.equipped.bow.push(key);
    }
    uiF[id] = 1;
    sfx.spell();
    burst(cx, cy, 26, SPELLS[key].color, 260, 0.8, 3.4, 40);
    burst(cx, cy, 10, "#ffffff", 200, 0.5, 2.4);
  }

  function toggleEquip(key, weapon, id, cx, cy) {
    const p = player;
    if (p.spells[key] === 0) { deny(id); shopToast("Learn this spell first"); return; }
    const arr = p.equipped[weapon], at = arr.indexOf(key);
    if (at >= 0) arr.splice(at, 1);
    else if (arr.length < p.slots[weapon]) arr.push(key);
    else if (p.slots[weapon] === 1) arr[0] = key;
    else { deny(id); shopToast(`${weapon === "sword" ? "Sword" : "Bow"} sockets are full - unequip one first`); return; }
    uiF[id] = 1; sfx.sw();
    burst(cx, cy, 12, SPELLS[key].color, 160, 0.5, 2.6);
  }

  function buyBook(key, id, cx, cy) {
    const p = player, lv = p.bookLv[key];
    if (lv >= 5) { deny(id); return; }
    const c = BOOK[key].costs[lv];
    if (p.money < c) { deny(id); return; }
    p.money -= c;
    p.bookLv[key]++;
    if (lv === 0) { const f = p.book.indexOf(null); if (f >= 0) p.book[f] = key; }
    uiF[id] = 1;
    sfx.spell();
    burst(cx, cy, 26, BOOK[key].color, 260, 0.8, 3.4, 40);
    burst(cx, cy, 10, "#ffffff", 200, 0.5, 2.4);

  function toggleBook(key, id, cx, cy) {
    const p = player;
    if (p.bookLv[key] === 0) { deny(id); shopToast("Learn this spell first"); return; }
    const at = p.book.indexOf(key);
    if (at >= 0) p.book[at] = null;
    else {
      const f = p.book.indexOf(null);
      if (f < 0) { deny(id); shopToast("Spellbook is full - click a slot to unequip"); return; }
      p.book[f] = key;
    }
    uiF[id] = 1; sfx.sw();
    burst(cx, cy, 12, BOOK[key].color, 160, 0.5, 2.6);

  function drawPips(x, y, w, h, count, max, color) {
    const gap = 3, pw = (w - gap * (max - 1)) / max;
    for (let i = 0; i < max; i++) {
      ctx.fillStyle = i < count ? color : "rgba(255,255,255,.12)";
      rrect(x + i * (pw + gap), y, pw, h, 2); ctx.fill();
    }
  }

  function paragraphN(s, size, color, x, y, maxW, lh, maxLines) {
    ctx.font = `normal ${size}px ${FONT}`;
    const words = s.split(" ");
    const lines = [];
    let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    lines.slice(0, maxLines).forEach((ln, i) => {
      let out = ln;
      if (i === maxLines - 1 && lines.length > maxLines) out = ln.replace(/\s*\S*$/, "") + "...";
      text(out, size, color, x, y + i * lh, "left", "normal");
    });
  }

  function priceButton(x, y, w, h, cost, st) {
    // st: ok | poor | max | full
    if (st === "max") {
      panel(x, y, w, h, "rgba(70,200,100,.15)", "rgba(70,200,100,.8)", 8);
      text("MAX", 14, GREEN, x + w / 2, y + h / 2 - 8, "center");
      return;
    }
    if (st === "full") {
      panel(x, y, w, h, "rgba(255,255,255,.06)", "rgba(255,255,255,.25)", 8);
      text("FULL HP", 13, "#9a9aa8", x + w / 2, y + h / 2 - 7, "center");
      return;
    }
    const ok = st === "ok";
    if (ok) {
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "#ffe27a"); g.addColorStop(1, "#e3a91c");
      ctx.fillStyle = g; rrect(x, y, w, h, 8); ctx.fill();
    } else {
      panel(x, y, w, h, "rgba(255,80,80,.1)", "rgba(255,90,90,.55)", 8);

  function drawUpgradeCard(it, x, y, w, h, accent) {
    const p = player, id = "it:" + it.id;
    const hov = inRect(mouse.x, mouse.y, x, y, w, h);
    const a = stepAnim(id, hov);
    const lv = itemLevel(it), cost = itemCost(it);
    const maxed = cost === null;
    const full = it.consumable && p.hp >= p.maxHp;
    const afford = !maxed && !full && p.money >= cost;
    const sh = uiS[id] > 0 ? Math.sin(uiS[id] * 28) * 4 * uiS[id] : 0;
    if (uiS[id] > 0) uiS[id] = Math.max(0, uiS[id] - 0.06);
    if (uiF[id] > 0) uiF[id] = Math.max(0, uiF[id] - 0.04);

    ctx.save();
    ctx.translate(sh, -a * 3);
    const cp = h < 110;
    ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 12 + a * 10; ctx.shadowOffsetY = 4;
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, hov ? "#34344a" : "#2a2a3c"); g.addColorStop(1, hov ? "#272738" : "#20202e");
    ctx.fillStyle = g; rrect(x, y, w, h, 14); ctx.fill();

    rrect(x, y, w, h, 14); ctx.stroke();
    if (uiF[id] > 0) { ctx.fillStyle = `rgba(255,255,255,${uiF[id] * 0.4})`; rrect(x, y, w, h, 14); ctx.fill(); }

    ctx.beginPath(); ctx.arc(x + 40, y + (cp ? 38 : 42), 26, 0, TAU);
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.globalAlpha = 0.7; ctx.stroke(); ctx.globalAlpha = 1;
    drawIcon(it.icon, x + 40, y + (cp ? 38 : 42), 15, accent);

    text(it.name, 17, "#ffffff", x + 80, y + 11);
    text(it.desc, 12, "#a8a8bc", x + 80, y + (cp ? 31 : 34), "left", "normal");
    if (!it.consumable) drawPips(x + 80, y + (cp ? 50 : 56), 188, 7, lv, it.max, accent);
    else text("CONSUMABLE", 10, "#8a8aa0", x + 80, y + (cp ? 50 : 56));

    const cur = fmt(it.get(p), it), nxt = fmt(it.next(p), it);

    priceButton(x + w - 102, y + h - 40, 90, 30, cost, maxed ? "max" : full ? "full" : afford ? "ok" : "poor");
    ctx.restore();

    addHit(x, y, w, h, () => buyItem(it, id, x + w / 2, y + h / 2));
    return hov;

  function drawLoadoutPanel(x, y, w, h) {
    const p = player;
    panel(x, y, w, h, "rgba(255,255,255,.045)", "rgba(255,255,255,.12)", 16);
    text("LOADOUT", 13, "#8a8aa0", x + 18, y + 14);
    if (rebirths > 0) text(`x${p.mult} upgrades`, 12, GOLD, x + w - 18, y + 14, "right");

    const cx = x + w / 2, cy = y + 140;
    const fg = ctx.createRadialGradient(cx, cy + 56, 4, cx, cy + 56, 100);
    fg.addColorStop(0, "rgba(160,130,255,.35)"); fg.addColorStop(1, "rgba(160,130,255,0)");
    ctx.fillStyle = fg; ctx.fillRect(x, cy - 40, w, 200);
    const weaponKey = shopTab === 1 ? "bow" : "sword";
    const eqs = p.equipped[weaponKey];
    const st = {
      weapon: weaponKey, reach: p.reach, arc: p.arc, glow: spellColor(eqs), colors: spellColors(eqs),
      walk: 0, moving: false, swingU: -1, swingDir: 1, pull: 0, recoil: 0, switchS: 1,
    };
    if (weaponKey === "sword") {
      const cyc = (time % 2.2) / 2.2;
      if (cyc < 0.22) { st.swingU = cyc / 0.22; st.swingDir = Math.floor(time / 2.2) % 2 ? -1 : 1; }
    } else {
      const cyc = (time % 2.0) / 2.0;
      st.pull = cyc < 0.7 ? cyc / 0.7 : 0;
      if (cyc >= 0.7 && cyc < 0.82) st.recoil = 0.13 * (1 - (cyc - 0.7) / 0.12);
    }

    drawBg();
    text("MASK SLAYER", 78, "#ffffff", W / 2, 80, "center");
    text("Slay the black masks. Master two weapons. Cast spells. Beat the boss. Rebirth. Repeat.", 17, "#aaaabb", W / 2, 172, "center", "normal");
    if (rebirths > 0) text(`REBIRTH ${rebirths}  ·  upgrades x${Math.pow(2, rebirths)}  ·  enemies x${Math.pow(2, rebirths)}  ·  boss x${Math.pow(5, rebirths)}`, 18, GOLD, W / 2, 202, "center");
    const st = { weapon: "sword", reach: 75, arc: 2.27, glow: "#ff7a1a", colors: ["#ff7a1a", "#58c8ff"], walk: time * 3, moving: false, swingU: -1, swingDir: 1, pull: 0, recoil: 0, switchS: 1 };
    const cyc = (time % 2) / 2;
    if (cyc < 0.22) st.swingU = cyc / 0.22;
    if (Math.random() < 0.5) emitSpellFx(Math.random() < 0.5 ? "fire" : "frost", W / 2 + rand(0, 80), 330 + rand(-20, 30));
    ctx.save(); ctx.translate(W / 2, 340); ctx.scale(2.2, 2.2);
    drawHero(0, 0, 18, 0.1, st, false);
    ctx.restore();
    for (const sd of [-1, 1]) {
      ctx.save(); ctx.translate(W / 2 + sd * 230, 355); ctx.scale(1.6, 1.6);
      drawShadow(0, 0, 20);
      drawBody(0, 0, 20, "#0f0f13", "#1e1e25", "#e83030", "rgba(255,255,255,.18)", sd > 0 ? Math.PI : 0, false, time * 6 + sd, 1);
      ctx.restore();
    }
    drawParticles();
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    ctx.globalAlpha = 0.65 + pulse * 0.35;
    text("Click or press ENTER to start", 28, GREEN, W / 2, 452, "center");
    ctx.globalAlpha = 1;
    text("WASD move · Mouse aim · Click attack · Space roll · F parry · 1 Sword · 2 Bow · Q E R spellbook", 15, "#aaaabb", W / 2, 505, "center", "normal");
    text("Every level brings a new kind of enemy. Every 20th level is a boss.", 14, "#8a8aa0", W / 2, 532, "center", "normal");
    drawButton(W / 2 - 150, 568, 240, 40, "CUSTOMIZE YOUR SLAYER", "rgba(185,123,255,.25)", "#e6d2ff", () => openCustomize("title"), 14);
    drawButton(24, 568, 210, 40, "COLOR-BLIND MODES", "rgba(159,180,255,.2)", "#d6e0ff", () => openAccess("title"), 14);
    if (rebirths > 0) {
      const armed = time < resetArm;
      drawButton(W / 2 + 100, 568, 130, 40, armed ? "CONFIRM?" : "RESET", armed ? "rgba(224,64,64,.5)" : "rgba(255,255,255,.08)", "#ffffff", () => {
        if (time < resetArm) { rebirths = 0; saveProg(); resetArm = 0; sfx.deny(); } else resetArm = time + 3;
      }, 12);
    }
    canvas.style.cursor = hits.some((h) => inRect(mouse.x, mouse.y, h.x, h.y, h.w, h.h)) ? "pointer" : "default";
  }

  function dimOverlay(a) {
    ctx.fillStyle = `rgba(5,5,10,${a})`;
    ctx.fillRect(0, 0, W, H);
  }

  function drawEnd(kind) {
    hits = [];
    drawPlayScene();
    dimOverlay(Math.min(0.72, stateTime * 1.2));
    drawParticles();
    const a = clamp((stateTime - 0.3) * 2, 0, 1);
    ctx.globalAlpha = a;
    if (kind === "dead") {
      outlined("YOU DIED", 84, "#ff5a5a", W / 2, H / 2 - 100, "center");
      outlined(`Reached level ${level} of cycle ${rebirths + 1}`, 24, "#ffffff", W / 2, H / 2 + 6, "center");
      outlined("You start the cycle again with nothing - your rebirth bonus stays.", 15, "#c8c8d8", W / 2, H / 2 + 44, "center");
      if (stateTime > 0.9) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4);
        outlined("Press R or click to try again", 20, "#c8c8d8", W / 2, H / 2 + 84, "center");
      }
    } else {
      const name = boss ? boss.style.name : "The Boss";
      outlined(`${name.toUpperCase()} HAS FALLEN`, 46, GOLD, W / 2, H / 2 - 120, "center");
      outlined(`Rebirth to begin cycle ${rebirths + 2}`, 24, "#ffffff", W / 2, H / 2 - 52, "center");
      outlined(`You lose all money, upgrades and spells, but every upgrade becomes x${Math.pow(2, rebirths + 1)} as strong`, 15, "#d8d8e8", W / 2, H / 2 - 16, "center");
      outlined(`Enemies come back x${Math.pow(2, rebirths + 1)} tougher and the boss x${Math.pow(5, rebirths + 1)}!`, 14, "#ff9a8a", W / 2, H / 2 + 8, "center");
      ctx.globalAlpha = 1;
      if (stateTime > 1.0) drawButton(W / 2 - 150, H / 2 + 50, 300, 56, "REBIRTH  (Enter)", GREEN, "#0b2a16", doRebirth, 22);
    }
    ctx.globalAlpha = 1;
    canvas.style.cursor = hits.some((h) => inRect(mouse.x, mouse.y, h.x, h.y, h.w, h.h)) ? "pointer" : "default";
  }

  // =====================================================================
  //  INPUT HANDLERS
  // =====================================================================
  function onKey(e) {
    if (e.code === "KeyM") { muted = !muted; return; }
    if (e.code === "KeyC" && state !== "customize") { cycleAccess(); return; }
    if (state === "title" && (e.code === "Enter" || e.code === "Space")) {
      resetGame(); setState("play");
    } else if (state === "play") {
      if (e.code === "Digit1" || e.code === "Numpad1") setWeapon("sword");
      else if (e.code === "Digit2" || e.code === "Numpad2") setWeapon("bow");
      else if (e.code === "Digit3" || e.code === "Numpad3") castBook(0);
      else if (e.code === "Digit4" || e.code === "Numpad4") castBook(1);
      else if (e.code === "Digit5" || e.code === "Numpad5") castBook(2);
      else if (BOOK_KEYS.includes(e.code)) castBook(BOOK_KEYS.indexOf(e.code));
      else if (e.code === "Space") startRoll();
      else if (e.code === "KeyF") startParry();
      else if (e.code === "KeyP" || e.code === "Escape") setState("pause");
    } else if (state === "pause") {
      if (e.code === "KeyP" || e.code === "Escape" || e.code === "Enter") setState("play");
    } else if (state === "access") {
      if (e.code === "Escape" || e.code === "Enter") closeAccess();
    } else if (state === "customize") {
      if (e.code === "Escape" || e.code === "Enter") closeCustomize();
    } else if (state === "shop" && stateTime > 0.2) {
      if (e.code === "KeyE" || e.code === "ArrowRight") { shopTab = (shopTab + 1) % TABS.length; sfx.sw(); }
      else if (e.code === "KeyQ" || e.code === "ArrowLeft") { shopTab = (shopTab + TABS.length - 1) % TABS.length; sfx.sw(); }
      else if (e.code === "Enter") continueFromShop();
    } else if (state === "gameover" && e.code === "KeyR" && stateTime > 0.7) {
      resetGame(); setState("play");
    } else if (state === "rebirth" && (e.code === "Enter" || e.code === "Space") && stateTime > 1.0) {
      doRebirth();
    }
  }

  function clickHits() {
    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      if (inRect(mouse.x, mouse.y, h.x, h.y, h.w, h.h)) { h.fn(); return true; }
    }
    return false;
  }

  function onClick() {
    if (state === "title") {
      if (!clickHits()) { resetGame(); setState("play"); }
    } else if (state === "customize") {
      clickHits();
    } else if (state === "access") {
      clickHits();
    } else if (state === "pause") {
      if (!clickHits()) setState("play");
    } else if (state === "shop" && stateTime > 0.2) {
      clickHits();
    } else if (state === "gameover" && stateTime > 0.9) {
      resetGame(); setState("play");
    } else if (state === "rebirth" && stateTime > 1.0) {
      clickHits();
    }
  }

  // =====================================================================
  //  MAIN LOOP
  // =====================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    stateTime += dt;
    time += dt;
    updateParticles(dt);
    canvas.style.cursor = state === "play" || state === "pause" ? "crosshair" : "default";

    if (state === "play") {
      if (hitstopT > 0) hitstopT -= dt; else updatePlay(dt);
    } else {
      shake = Math.max(0, shake - 28 * dt);
      hurtFlash = Math.max(0, hurtFlash - dt);
      flashScreen = Math.max(0, flashScreen - dt * 1.6);
    }

    if (state === "title") drawTitle();
    else if (state === "play") drawPlayScene();
    else if (state === "pause") {
      hits = [];
      drawPlayScene();
      dimOverlay(0.6);
      outlined("PAUSED", 70, "#ffffff", W / 2, H / 2 - 60, "center");
      outlined("Press P or click to resume", 22, "#c8c8d8", W / 2, H / 2 + 20, "center");
      drawButton(W / 2 - 140, H / 2 + 70, 280, 44, "COLOR-BLIND MODES  (C)", "rgba(159,180,255,.25)", "#d6e0ff", () => openAccess("pause"), 15);
      canvas.style.cursor = hits.some((h) => inRect(mouse.x, mouse.y, h.x, h.y, h.w, h.h)) ? "pointer" : "crosshair";
    } else if (state === "access") drawAccess();
    else if (state === "shop") drawShop();
    else if (state === "customize") drawCustomize();
    else if (state === "gameover") drawEnd("dead");
    else if (state === "rebirth") {
      if (Math.random() < dt * 5) {
        const c = ["#ffd23c", "#ff6a6a", "#6ad0ff", "#9cff8a", "#d08cff"][Math.floor(Math.random() * 5)];
        burst(rand(100, W - 100), rand(80, 300), 22, c, 280, 1.4, 3.5, 260);
        sparks(rand(100, W - 100), rand(80, 300), 12, c, 300, 0.8, 2.4);
      }
      drawEnd("win");
    }
    if (accessToastT > 0) {
      accessToastT -= dt;
      ctx.globalAlpha = clamp(accessToastT * 2, 0, 1);
      panel(W / 2 - 190, 14, 380, 36, "rgba(10,10,18,.9)", "rgba(255,255,255,.4)", 12);
      text(accessToastText, 15, "#ffffff", W / 2, 23, "center");
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }

  player = newPlayer();
  level = 1;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
